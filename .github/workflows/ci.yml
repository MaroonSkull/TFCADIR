# Comprehensive CI Workflow for TFCADIR
# Includes multi-platform builds, clang-tidy analysis, clangd support, and testing
# See: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build directory for CMake
  BUILD_DIR: ${{ github.workspace }}/build
  # Enable compile_commands.json generation for clangd
  CMAKE_EXPORT_COMPILE_COMMANDS: ON

jobs:
  # ============================================================================
  # Build and Test Job
  # ============================================================================
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      # Continue other matrix jobs even if one fails
      fail-fast: false
      matrix:
        include:
          # Ubuntu with GCC
          - os: ubuntu-latest
            compiler: gcc
            c_compiler: gcc
            cpp_compiler: g++
          # Ubuntu with Clang
          - os: ubuntu-latest
            compiler: clang
            c_compiler: clang
            cpp_compiler: clang++
          # Windows with MSVC
          - os: windows-latest
            compiler: msvc
            c_compiler: cl
            cpp_compiler: cl

    steps:
      # ------------------------------------------------------------------------
      # Step 1: Checkout repository with all submodules
      # The project has 7 git submodules in Dependencies/ directory
      # ------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ------------------------------------------------------------------------
      # Step 2: Install system dependencies (Ubuntu)
      # Required packages: OpenGL, Boost, spdlog, yaml-cpp
      # ------------------------------------------------------------------------
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libboost-all-dev \
            libspdlog-dev \
            libyaml-cpp-dev \
            clang-tidy \
            libxrandr-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev

      # ------------------------------------------------------------------------
      # Step 3: Install system dependencies (Windows) using vcpkg
      # Note: OpenGL is included in Windows SDK, no need to install
      # ------------------------------------------------------------------------
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install boost spdlog yaml-cpp
          vcpkg integrate install

      # ------------------------------------------------------------------------
      # Step 4: Setup caching for vcpkg packages (Windows)
      # Speeds up builds by caching installed packages
      # ------------------------------------------------------------------------
      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/installed
            ${{ github.workspace }}/build/vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      # ------------------------------------------------------------------------
      # Step 5: Cache CMake build directory
      # Speeds up subsequent builds
      # ------------------------------------------------------------------------
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_DIR }}
          key: ${{ runner.os }}-${{ matrix.compiler }}-cmake-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-cmake-

      # ------------------------------------------------------------------------
      # Step 6: Setup CMake
      # CMakeLists.txt requires version 3.30, which is not default on runners
      # ------------------------------------------------------------------------
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30'

      # ------------------------------------------------------------------------
      # Step 7: Configure CMake (Ubuntu)
      # Generate compile_commands.json for clangd support
      # ------------------------------------------------------------------------
      - name: Configure CMake (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          cmake -B ${{ env.BUILD_DIR }} \
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -S ${{ github.workspace }}

      # ------------------------------------------------------------------------
      # Step 7: Configure CMake (Windows)
      # Use vcpkg toolchain for dependency resolution
      # ------------------------------------------------------------------------
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B ${{ env.BUILD_DIR }} `
            -DCMAKE_C_COMPILER=${{ matrix.c_compiler }} `
            -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" `
            -S ${{ github.workspace }}

      # ------------------------------------------------------------------------
      # Step 8: Build the project (Ubuntu)
      # Use parallel compilation with all available cores
      # ------------------------------------------------------------------------
      - name: Build (Ubuntu)
        if: runner.os == 'Linux'
        run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel $(nproc)

      # ------------------------------------------------------------------------
      # Step 9: Build the project (Windows)
      # MSBuild uses /m flag by default for parallel builds
      # ------------------------------------------------------------------------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build ${{ env.BUILD_DIR }} --config Release

      # ------------------------------------------------------------------------
      # Step 10: Run clang-tidy static analysis (Ubuntu only)
      # Uses compile_commands.json generated by CMake
      # ------------------------------------------------------------------------
      - name: Run clang-tidy (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          echo "Running clang-tidy static analysis..."
          clang-tidy -p ${{ env.BUILD_DIR }} \
            $(find ${{ github.workspace }}/Src -name '*.cpp' -type f) \
            2>&1 | tee clang-tidy-report.txt || true
          
          # Check if there are any warnings
          if grep -q "warning:" clang-tidy-report.txt; then
            echo "::warning::clang-tidy found issues. See the report for details."
          else
            echo "clang-tidy: No issues found."
          fi

      # ------------------------------------------------------------------------
      # Step 11: Upload clang-tidy report as artifact
      # ------------------------------------------------------------------------
      - name: Upload clang-tidy report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report-${{ matrix.compiler }}
          path: clang-tidy-report.txt
          retention-days: 30

      # ------------------------------------------------------------------------
      # Step 12: Upload compile_commands.json for clangd
      # This artifact can be downloaded for local IDE integration
      # ------------------------------------------------------------------------
      - name: Upload compile_commands.json
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands-${{ matrix.os }}-${{ matrix.compiler }}
          path: ${{ env.BUILD_DIR }}/compile_commands.json
          retention-days: 30

      # ------------------------------------------------------------------------
      # Step 13: Run tests
      # Execute tests defined by the CMake configuration
      # ------------------------------------------------------------------------
      - name: Test
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --build-config Release --output-on-failure --timeout 300
        continue-on-error: true

  # ============================================================================
  # CodeQL Security Analysis Job
  # ============================================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libboost-all-dev \
            libspdlog-dev \
            libyaml-cpp-dev \
            libxrandr-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: c-cpp
          build-mode: autobuild

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:c-cpp"

  # ============================================================================
  # Summary Job - Runs after all other jobs complete
  # ============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build, codeql]
    if: always()

    steps:
      - name: Check build results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build (all platforms) | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{ needs.codeql.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
