# FSM Configuration for TFCADIR Controller
# Defines states and transitions for the drawing application

# Global variables
variables:
  mouse_x: 0.0
  mouse_y: 0.0

# State definitions
states:
  Idle:
    on_enter: on_idle_enter
    on_exit: on_idle_exit
    actions:
      - log_idle_state

  DrawingProcessing:
    on_enter: on_drawing_enter
    on_exit: on_drawing_exit
    actions:
      - log_drawing_state

  MoveFirstPoint:
    on_enter: on_move_first_point_enter
    on_exit: on_move_first_point_exit
    actions:
      - log_move_first_point_state

# Transition definitions
transitions:
  # From Idle to DrawingProcessing on figure creation events
  - from: Idle
    to: DrawingProcessing
    event: OnAddTriangleByCenter
    on_transition: on_start_drawing

  - from: Idle
    to: DrawingProcessing
    event: OnAddTriangleByCorners
    on_transition: on_start_drawing

  - from: Idle
    to: DrawingProcessing
    event: OnAddSquareByCenter
    on_transition: on_start_drawing

  - from: Idle
    to: DrawingProcessing
    event: OnAddSquareByCorners
    on_transition: on_start_drawing

  - from: Idle
    to: DrawingProcessing
    event: OnAddNgonByCenter
    on_transition: on_start_drawing

  - from: Idle
    to: DrawingProcessing
    event: OnAddCircleByCenter
    on_transition: on_start_drawing

  - from: Idle
    to: DrawingProcessing
    event: OnAddLine
    on_transition: on_start_drawing

  # From DrawingProcessing to MoveFirstPoint on mouse move
  - from: DrawingProcessing
    to: MoveFirstPoint
    event: OnMouseMove
    on_transition: on_move_to_first_point

  # From MoveFirstPoint back to DrawingProcessing
  - from: MoveFirstPoint
    to: DrawingProcessing
    event: OnMouseMove
    on_transition: on_update_drawing

  # From DrawingProcessing back to Idle (figure completed)
  - from: DrawingProcessing
    to: Idle
    event: OnFigureComplete
    on_transition: on_complete_figure

  # From MoveFirstPoint back to Idle (cancelled)
  - from: MoveFirstPoint
    to: Idle
    event: OnFigureCancel
    on_transition: on_cancel_figure
