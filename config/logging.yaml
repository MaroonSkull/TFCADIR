# Logging configuration for TFCADIR
# This file configures the logging system with three sinks:
# - File: Rotating file logger for persistent log storage
# - Console: Fatal-only output to system console (stderr)
# - ImGUI: In-app log viewer with circular buffer

# Global log level
# Available levels: trace, debug, info, warn, error, critical, off
level: info

# File sink configuration
file:
  # Base filename for log files
  base_filename: logs/tfcadir.log
  
  # Maximum size of each log file in bytes (default: 10 MB)
  max_file_size: 10485760
  
  # Maximum number of rotated files to keep
  max_files: 5
  
  # Log level that triggers immediate flush
  # Available levels: trace, debug, info, warn, error, critical, off
  flush_level: err
  
  # Flush interval in seconds
  flush_interval: 1

# Console sink configuration
# Only outputs critical/fatal errors to the system console
console:
  # Minimum log level to output to console
  # Set to critical to only show critical and fatal errors
  level: critical
  
  # Use ANSI color codes in output
  use_color: true

# ImGUI sink configuration
# In-app log viewer with circular buffer
imgui:
  # Maximum number of log entries to keep in the circular buffer
  max_entries: 10000
  
  # Initial log level filter for the viewer
  # Set to trace to show all messages by default
  initial_level: trace
